# lychee configuration for ClaimFreedomWiki
# Docs: https://github.com/lycheeverse/lychee/blob/master/lychee.example.toml

# What to check - file patterns handled in workflow args
# Exclude specific paths (regex patterns)
exclude_path = ["node_modules"]

# Request behavior
max_redirects = 10
# accept field removed - use default accepted content types
scheme = ["http", "https"]

# Timeouts (seconds)
timeout = 20

# Retries with backoff
retries = 2
retry_wait_time = 2

# Exclusions (domains or patterns known to be flaky or blocked by bots)
exclude_mail = true

# Cache results between runs
cache = true
cache_path = ".lycheecache"

# Output
format = "markdown"
output = "lychee/out.md"

# Authentication via env (example placeholders)
# [headers]
# "Authorization" = "token ${GITHUB_TOKEN}"
