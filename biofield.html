<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Living Bio-Field</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Courier New', Courier, monospace;
            /* pointer-events: none; REMOVED so we can click the button */
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #ffd700;
            max-width: 320px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            transition: all 0.3s ease; /* Smooth transition */
        }
        h1 { 
            margin: 0; 
            font-size: 1.1rem; 
            color: #ffd700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            cursor: pointer; /* Clickable cursor */
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        h1:hover { color: #fff; }
        #legend-content {
            margin-top: 10px;
            display: block; /* Visible by default */
        }
        p { margin: 4px 0; font-size: 0.8rem; line-height: 1.4; }
        .cyan { color: #00ffff; font-weight: bold; text-shadow: 0 0 8px cyan; }
        .gold { color: #ffd700; font-weight: bold; text-shadow: 0 0 8px gold;}
        .red { color: #ff3333; font-weight: bold; text-shadow: 0 0 8px red;}
        .purple { color: #d000ff; font-weight: bold; text-shadow: 0 0 8px magenta; }
    </style>
</head>
<body>

    <div id="info">
        <h1 onclick="toggleLegend()">The Living Bio-Field <span id="toggle-icon">[-]</span></h1>
        <div id="legend-content">
            <p><span class="gold">Gold Lattice:</span> Abha Coil (1-2-4-8-7-5)</p>
            <p><span class="cyan">Cyan Flow:</span> Magnetic Energy</p>
            <p><span class="red">Red Plane:</span> Dielectric Inertial Plane</p>
            <p><span class="purple">Purple Funnel:</span> Hyperboloid (Counter-Space)</p>
            <p><span style="color: #00aaaa; font-weight: bold; text-shadow: 0 0 5px #00aaaa;">Outer Dots:</span> 9-Point Number Map</p>
            <p><span style="color: white; font-weight: bold; text-shadow: 0 0 8px white;">Center:</span> Heart Singularity (Zero-Point)</p>
            <p><i>The Universal Field anchored at the Human Heart.</i></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- LEGEND TOGGLE FUNCTION ---
        function toggleLegend() {
            const content = document.getElementById('legend-content');
            const icon = document.getElementById('toggle-icon');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.textContent = '[-]';
            } else {
                content.style.display = 'none';
                icon.textContent = '[+]';
            }
        }

        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 3000;
        // HORN TORUS CONFIGURATION: R (Major) equals r (Minor)
        const TUBE_RADIUS = 18;   
        const TORUS_RADIUS = 18;  
        
        let scene, camera, renderer;
        let particles, particleGeo;
        let rodinGroupCW, rodinGroupCCW, dielectricPlane;
        
        const particleData = [];
        let time = 0;

        function init() {
            scene = new THREE.Scene();
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 0.8);
            pointLight.position.set(0, 20, 20); // Light from front-top to illuminate body
            scene.add(pointLight);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 50); // Lower camera to look at the "person"
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            const sprite = createGlowTexture();

            createDielectricPlane();
            createAbhaCoilLattice(); 
            createHyperboloid(); 
            createHuman(); 
            // createChakras(); // REMOVED
            createParticles(sprite);

            window.addEventListener('resize', onWindowResize);
            setupControls();
            animate();
        }

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.2, 'rgba(0, 255, 255, 0.6)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        function createDielectricPlane() {
            const geometry = new THREE.RingGeometry(0.1, TORUS_RADIUS + TUBE_RADIUS + 5, 64);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0xff0000, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.05, 
                blending: THREE.AdditiveBlending,
                depthWrite: false 
            });
            dielectricPlane = new THREE.Mesh(geometry, material);
            dielectricPlane.rotation.x = -Math.PI / 2; 
            scene.add(dielectricPlane);
            
            // Center Heart Spark (Reverted to White Singularity)
            const centerGeo = new THREE.SphereGeometry(0.8, 32, 32);
            const centerMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
            const spark = new THREE.Mesh(centerGeo, centerMat);
            
            // Add a glow sprite to the heart
            const spriteMat = new THREE.SpriteMaterial({ 
                map: createGlowTexture(), 
                color: 0xffffff, // Pure White Glow
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending 
            });
            const glow = new THREE.Sprite(spriteMat);
            glow.scale.set(10, 10, 1); // Slightly larger
            glow.renderOrder = 10; // Force on top
            spark.add(glow);
            
            scene.add(spark);
        }

        // --- NEW: CREATE HUMAN FIGURE ---
        function createHuman() {
            const material = new THREE.MeshLambertMaterial({
                color: 0x00ddff,
                transparent: true,
                opacity: 0.3, 
                emissive: 0x004466,
                emissiveIntensity: 0.5,
                side: THREE.DoubleSide, 
                depthWrite: false,     
                wireframe: false
            });
            
            const humanGroup = new THREE.Group();
            
            // Measurements (Approximate units)
            // Heart is at 0,0,0.
            
            // 1. Torso (Upper & Lower)
            const torsoGeo = new THREE.CylinderGeometry(1.8, 1.4, 7, 16);
            const torso = new THREE.Mesh(torsoGeo, material);
            torso.position.y = -0.5; 
            humanGroup.add(torso);
            
            // 2. Head
            const headGeo = new THREE.SphereGeometry(1.4, 16, 16);
            const head = new THREE.Mesh(headGeo, material);
            head.position.y = 4.5; 
            humanGroup.add(head);
            
            // 3. Arms
            const armGeo = new THREE.CylinderGeometry(0.4, 0.3, 8, 8);
            const lArm = new THREE.Mesh(armGeo, material);
            lArm.position.set(2.2, 0, 0);
            lArm.rotation.z = Math.PI / 12; 
            humanGroup.add(lArm);
            const rArm = new THREE.Mesh(armGeo, material);
            rArm.position.set(-2.2, 0, 0);
            rArm.rotation.z = -Math.PI / 12;
            humanGroup.add(rArm);
            
            // 4. Legs
            const legGeo = new THREE.CylinderGeometry(0.6, 0.4, 9, 8);
            const lLeg = new THREE.Mesh(legGeo, material);
            lLeg.position.set(0.8, -8.5, 0);
            humanGroup.add(lLeg);
            const rLeg = new THREE.Mesh(legGeo, material);
            rLeg.position.set(-0.8, -8.5, 0);
            humanGroup.add(rLeg);
            
            scene.add(humanGroup);
        }

        function createAbhaCoilLattice() {
            rodinGroupCW = new THREE.Group();
            rodinGroupCCW = new THREE.Group();
            
            const material = new THREE.LineBasicMaterial({ 
                color: 0xffaa00, 
                opacity: 0.3, 
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            const windings = 24; 
            const pointsPerLine = 200;

            for (let dir = -1; dir <= 1; dir += 2) { 
                const targetGroup = (dir === 1) ? rodinGroupCW : rodinGroupCCW;
                for (let w = 0; w < windings; w++) {
                    const offset = (w / windings) * Math.PI * 2;
                    const points = [];
                    for (let i = 0; i <= pointsPerLine; i++) {
                        const u = (i / pointsPerLine) * Math.PI * 2;
                        const v = (u * 1.0 * dir) + offset; 
                        const r = TUBE_RADIUS;
                        const R = TORUS_RADIUS;
                        const px = (R + r * Math.cos(u)) * Math.cos(v);
                        const py = r * Math.sin(u);
                        const pz = (R + r * Math.cos(u)) * Math.sin(v);
                        points.push(new THREE.Vector3(px, py, pz));
                    }
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geo, material);
                    targetGroup.add(line);
                }
            }
            
            // Highlight Path attached to CW
            const highlightPoints = [];
            const doublingSequenceSteps = 600; 
            for (let i = 0; i < doublingSequenceSteps; i++) {
                const t = i / 100; 
                const u = t;
                const v = t * 1.0 + (Math.PI/2); 
                const r = TUBE_RADIUS * 1.02; 
                const R = TORUS_RADIUS;
                const px = (R + r * Math.cos(u)) * Math.cos(v);
                const py = r * Math.sin(u);
                const pz = (R + r * Math.cos(u)) * Math.sin(v);
                highlightPoints.push(new THREE.Vector3(px, py, pz));
            }
            const pathGeo = new THREE.BufferGeometry().setFromPoints(highlightPoints);
            const pathMat = new THREE.LineBasicMaterial({ color: 0xffd700, linewidth: 3 });
            rodinGroupCW.add(new THREE.Line(pathGeo, pathMat));

            // Nodes
            const nodeGeo = new THREE.SphereGeometry(0.8, 16, 16);
            for(let i=1; i<=9; i++) {
                 const angle = ((i-1) / 9) * Math.PI * 2;
                 const px = (TORUS_RADIUS + TUBE_RADIUS) * Math.cos(angle);
                 const pz = (TORUS_RADIUS + TUBE_RADIUS) * Math.sin(angle);
                 let color = 0x00aaaa;
                 if(i===9) color = 0xffffff;
                 if(i===3 || i===6) color = 0xaa00aa;
                 const mesh = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({color: color}));
                 mesh.position.set(px, 0, pz);
                 rodinGroupCW.add(mesh);
            }
            scene.add(rodinGroupCW);
            scene.add(rodinGroupCCW);
        }

        function createHyperboloid() {
            const material = new THREE.LineBasicMaterial({ 
                color: 0xd000ff, 
                opacity: 0.6, 
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const group = new THREE.Group();
            const strands = 24;
            const height = TORUS_RADIUS * 1.5; 
            const segments = 50;
            for(let s=0; s<strands; s++) {
                const strandPoints = [];
                const angle = (s / strands) * Math.PI * 2;
                for(let i=0; i<=segments; i++) {
                    const t = (i / segments) * 2 - 1; 
                    const r = Math.pow(Math.abs(t), 0.8) * (TORUS_RADIUS * 0.6); 
                    const y = t * height;
                    const twist = t * Math.PI; 
                    const px = r * Math.cos(angle + twist);
                    const pz = r * Math.sin(angle + twist);
                    strandPoints.push(new THREE.Vector3(px, y, pz));
                }
                const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(strandPoints), material);
                group.add(line);
            }
            scene.add(group);
        }

        function createParticles(sprite) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT);
            const colorBase = new THREE.Color(0x00ffff); 
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = Math.random() * Math.PI * 2; 
                const dir = Math.random() > 0.5 ? 1 : -1;
                const streamOffset = (Math.floor(Math.random() * 24) / 24) * Math.PI * 2;
                particleData.push({
                    u: u, streamOffset: streamOffset, dir: dir,
                    baseSpeed: Math.random() * 0.002 + 0.002,
                });
                positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
                colors[i*3] = colorBase.r; colors[i*3+1] = colorBase.g; colors[i*3+2] = colorBase.b;
                sizes[i] = Math.random() * 1.5 + 0.5;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            const material = new THREE.PointsMaterial({
                size: 1.2, map: sprite, vertexColors: true, blending: THREE.AdditiveBlending,
                depthTest: false, transparent: true, opacity: 0.8
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
            particleGeo = geometry;
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            rodinGroupCW.rotation.y = -time * 0.1;
            rodinGroupCCW.rotation.y = time * 0.1;
            particles.rotation.y = -time * 0.1;
            const positions = particleGeo.attributes.position.array;
            const colors = particleGeo.attributes.color.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const data = particleData[i];
                const distToCenter = Math.abs(Math.PI - Math.abs(data.u - Math.PI)); 
                const acceleration = 1.0 + (2.0 * Math.exp(-distToCenter * 2)); 
                data.u += data.baseSpeed * acceleration;
                if(data.u > Math.PI * 2) data.u -= Math.PI * 2;
                const v = (data.u * 1.0 * data.dir) + data.streamOffset; 
                const r = TUBE_RADIUS;
                const R = TORUS_RADIUS;
                const px = (R + r * Math.cos(data.u)) * Math.cos(v);
                const py = r * Math.sin(data.u);
                const pz = (R + r * Math.cos(data.u)) * Math.sin(v);
                positions[i * 3] = px;
                positions[i * 3 + 1] = py;
                positions[i * 3 + 2] = pz;
                const normalizeU = 1.0 - (Math.abs(data.u - Math.PI) / Math.PI);
                if (normalizeU > 0.85) {
                    colors[i*3] = 1.0; colors[i*3+1] = 1.0; colors[i*3+2] = 1.0; 
                } else {
                    colors[i*3] = 0.0; colors[i*3+1] = 0.6 * normalizeU; colors[i*3+2] = 1.0; 
                }
            }
            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.color.needsUpdate = true;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        function setupControls() {
            document.addEventListener('contextmenu', event => event.preventDefault());
            document.addEventListener('mousedown', (e) => {
                isDragging = true; previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });
            document.addEventListener('mouseup', (e) => { if (e.buttons === 0) isDragging = false; });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                if (e.buttons === 3) { 
                    const sensitivity = 0.002;
                    camera.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), -deltaMove.x * sensitivity);
                    camera.rotateX(-deltaMove.y * sensitivity);
                } else if (e.buttons === 1) { 
                    const panSpeed = 0.05;
                    camera.translateX(-deltaMove.x * panSpeed);
                    camera.translateY(deltaMove.y * panSpeed);
                }
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });
            document.addEventListener('wheel', (e) => { camera.translateZ(e.deltaY * 0.05); });
        }
        function toRadians(angle) { return angle * (Math.PI / 180); }
        init();
    </script>
</body>
</html>
